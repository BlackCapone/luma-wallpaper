[package]
name = "luma-wallpaper"
version = "0.3.0"
edition = "2021"

[dependencies]
anyhow = "1"
cpal = "0.15"
dunce = "1"
rfd = "0.15"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
ureq = "2"
url = "2"
winit = "0.30"
winreg = "0.52"
wry = "0.47"
zip = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
